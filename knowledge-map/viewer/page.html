<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyWiki source page</title>
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      --bg: #0d1117;
      --surface: #131b29;
      --surface-2: #18233a;
      --border: #273244;
      --border-strong: #3a4a63;
      --text: #e6edf3;
      --text-secondary: #aab6c8;
      --text-muted: #8b9ab4;
      --accent: #6ea8fe;
      --accent-strong: #8ec1ff;
      --code-bg: #0b111c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, a { font: inherit; }
    h1, h2, h3, h4, p, ul, ol, pre, blockquote { margin: 0; }
    ::selection { background: #1b3354; color: #eef5ff; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Sticky header */
    .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
    .bar-inner { max-width: 44rem; margin: 0 auto; padding: 16px 24px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .bar-title { min-width: 0; }
    .crumb { color: var(--text-muted); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
    h1 { margin-top: 7px; font-size: 24px; line-height: 1.25; letter-spacing: -.02em; font-weight: 700; overflow-wrap: anywhere; }
    .bar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ghost { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 9px; padding: 9px 13px; color: var(--text-secondary); font-size: 14px; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); color: var(--text); }
    .back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #4d82bd; background: #173557; border-radius: 9px; padding: 9px 13px; color: #e7f1ff; text-decoration: none; font-size: 14px; }
    .back:hover { background: #214a78; }

    /* Reader column */
    .reader { max-width: 44rem; margin: 0 auto; padding: 32px 24px 96px; }
    .article { max-width: 38rem; }
    .lede { color: var(--text-secondary); font-size: 16px; line-height: 1.75; margin-bottom: 22px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px; color: var(--text-secondary); font-size: 12px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .meta { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .meta-k { color: var(--text-secondary); margin-right: 6px; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
    .sources { margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .sources-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 10px; }
    .sources ul { list-style: none; padding: 0; display: grid; gap: 6px; }
    .sources li { color: var(--text-secondary); font-size: 14px; font-family: var(--mono); overflow-wrap: anywhere; }
    .src-kind { display: inline-block; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; margin-right: 8px; font-size: 12px; color: var(--text-muted); background: var(--surface); }

    /* Markdown body */
    .md > * + * { margin-top: 16px; }
    .md > :first-child { margin-top: 0; }
    .md h2 { font-size: 22px; line-height: 1.3; font-weight: 650; letter-spacing: -.015em; margin-top: 34px; }
    .md h3 { font-size: 18px; line-height: 1.35; font-weight: 600; margin-top: 26px; }
    .md h4 { font-size: 16px; line-height: 1.5; font-weight: 650; margin-top: 20px; }
    .md p { font-size: 16px; line-height: 1.75; color: var(--text); }
    .md ul, .md ol { padding-left: 22px; display: grid; gap: 7px; }
    .md li { font-size: 16px; line-height: 1.7; }
    .md li::marker { color: var(--text-muted); }
    .md strong { font-weight: 650; color: #fff; }
    .md em { color: var(--text-secondary); }
    .md code { font-family: var(--mono); font-size: .875em; background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
    .md a { color: var(--accent-strong); text-decoration: underline; text-decoration-color: #4d82bd; text-underline-offset: 3px; }
    .md a:hover { color: #b8d8ff; text-decoration-color: var(--accent-strong); }
    .md .wikilink { color: var(--accent-strong); background: #1b335422; border-bottom: 1px dashed #4d82bd; padding: 0 2px; }
    .md blockquote { border-left: 1px solid #3a4a63; background: var(--surface); border-radius: 0 8px 8px 0; padding: 12px 16px; color: var(--text-secondary); }
    .md blockquote p { color: var(--text-secondary); font-size: 14px; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 9px; padding: 14px 16px; overflow-x: auto; }
    .code-block code { font-family: var(--mono); font-size: 14px; line-height: 1.6; color: #dbe7f6; background: none; border: none; padding: 0; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; }
    .md table { border-collapse: collapse; width: 100%; font-size: 14px; }
    .md th, .md td { text-align: left; padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .md th { font-weight: 650; color: #fff; background: var(--surface); font-size: 14px; }
    .md td { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .md tr:last-child td { border-bottom: none; }

    /* Raw view */
    .raw { max-width: 44rem; margin: 0 auto; padding: 32px 24px 96px; }
    .raw pre { font-family: var(--mono); font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: #dbe7f6; }

    .state { color: var(--text-muted); font-size: 14px; }
    .error { color: #ffb4b4; font-size: 14px; }

    .reader, .raw { scrollbar-width: thin; scrollbar-color: #33445f transparent; }

    @media (max-width: 767px) {
      .bar-inner { padding: 13px 16px 12px; align-items: flex-start; flex-direction: column; }
      .bar-actions { width: 100%; }
      .ghost, .back { flex: 1; justify-content: center; min-height: 44px; }
      h1 { font-size: 21px; }
      .reader { padding: 24px 16px 80px; }
      .md h2 { font-size: 19px; }
    }
    @media (pointer: coarse) {
      .ghost, .back { min-height: 44px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div class="bar-title">
        <div class="crumb" id="crumb">正在加载…</div>
        <h1 id="title">正在加载…</h1>
      </div>
      <div class="bar-actions">
        <button id="raw-toggle" class="ghost" aria-pressed="false">查看 Markdown 原文</button>
        <a class="back" href="index.html"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>返回地图</a>
      </div>
    </div>
  </header>

  <main class="reader" id="reader"><div id="article" class="article"><p class="state">正在加载页面…</p></div></main>
  <div class="raw" id="raw" hidden></div>

  <script>
    const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[c]));

    function parseFrontmatter(text) {
      const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
      if (!match) return { meta: {}, body: text };
      const meta = {};
      const lines = match[1].split('\n');
      let i = 0;
      while (i < lines.length) {
        const kv = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(lines[i]);
        if (!kv) { i++; continue; }
        const key = kv[1];
        const value = kv[2].trim();
        if (value) {
          meta[key] = value.replace(/^"(.*)"$/, '$1').replace(/^'(.*)'$/, '$1');
          i++;
        } else {
          const items = [];
          i++;
          while (i < lines.length && /^\s+[-*]\s+/.test(lines[i])) {
            const item = lines[i].replace(/^\s+[-*]\s+/, '');
            items.push(item);
            i++;
            while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s+[-*]\s+/.test(lines[i])) {
              items[items.length - 1] += '\n' + lines[i].trimStart();
              i++;
            }
          }
          meta[key] = items;
        }
      }
      return { meta, body: text.slice(match[0].length) };
    }

    function renderInline(text) {
      const codes = [];
      text = text.replace(/`([^`]+)`/g, (m, code) => { codes.push(code); return `\u0000${codes.length - 1}\u0000`; });
      text = escapeHtml(text);
      text = text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, label) => `<span class="wikilink" title="页面引用">${label || target}</span>`);
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
        const external = /^https?:\/\//i.test(url);
        return `<a href="${url}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${label}</a>`;
      });
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      text = text.replace(/\u0000(\d+)\u0000/g, (m, idx) => `<code>${escapeHtml(codes[+idx])}</code>`);
      return text;
    }

    const isBlockStart = (line) => /^(#{1,6}\s|```|>\s?|\s*[-*+]\s+|\s*\d+[.)]\s+|\s*\|)/.test(line) || /^\s*([-*_])\s*(\1\s*){2,}\s*$/.test(line);
    const isTableSeparator = (line) => /^\s*\|?[\s:|-]+\|[\s:|-]*\s*$/.test(line) && /-/.test(line);

    function renderBlocks(lines) {
      const out = [];
      let i = 0;
      let titleDropped = false;
      while (i < lines.length) {
        const line = lines[i];

        if (/^```/.test(line)) {
          i++;
          const buf = [];
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++;
          out.push(`<pre class="code-block"><code>${escapeHtml(buf.join('\n'))}</code></pre>`);
          continue;
        }
        if (!line.trim()) { i++; continue; }

        const heading = /^(#{1,6})\s+(.*)$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          const text = heading[2].trim();
          if (level === 1 && !titleDropped) { titleDropped = true; i++; continue; }
          const tag = `h${Math.min(level, 6)}`;
          out.push(`<${tag}>${renderInline(text)}</${tag}>`);
          i++;
          continue;
        }

        if (/^\s*([-*_])\s*(\1\s*){2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

        if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
          const header = splitRow(line);
          const rows = [];
          i += 2;
          while (i < lines.length && /^\s*\|/.test(lines[i]) && !isTableSeparator(lines[i])) { rows.push(splitRow(lines[i])); i++; }
          const thead = `<thead><tr>${header.map((c) => `<th>${renderInline(c)}</th>`).join('')}</tr></thead>`;
          const tbody = rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(c)}</td>`).join('')}</tr>`).join('');
          out.push(`<div class="table-wrap"><table>${thead}<tbody>${tbody}</tbody></table></div>`);
          continue;
        }

        if (/^\s*>/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
          out.push(`<blockquote>${renderBlocks(buf)}</blockquote>`);
          continue;
        }

        if (/^\s*[-*+]\s+/.test(line)) {
          const { html, next } = renderList(lines, i, false);
          out.push(html);
          i = next;
          continue;
        }
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const { html, next } = renderList(lines, i, true);
          out.push(html);
          i = next;
          continue;
        }

        const buf = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i].trim()); i++; }
        out.push(`<p>${renderInline(buf.join(' '))}</p>`);
      }
      return out.join('\n');
    }

    function splitRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((s) => s.trim());
    }

    function renderList(lines, start, ordered) {
      const itemRe = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      const items = [];
      let i = start;
      while (i < lines.length && itemRe.test(lines[i])) {
        const buf = [lines[i].replace(itemRe, '')];
        i++;
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i].trim()); i++; }
        items.push(buf.join(' '));
      }
      const tag = ordered ? 'ol' : 'ul';
      return { html: `<${tag}>${items.map((it) => `<li>${renderInline(it)}</li>`).join('')}</${tag}>`, next: i };
    }

    function sourceBlock(sources) {
      const items = sources.map((source) => {
        const s = String(source);
        const wl = /^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]$/.exec(s.trim());
        if (wl) return `<li><span class="src-kind">wikilink</span>${escapeHtml(wl[2] || wl[1])}</li>`;
        const kind = /(?:^|\n)kind:\s*(.+)/.exec(s)?.[1];
        const page = /(?:^|\n)page:\s*(.+)/.exec(s)?.[1]?.replace(/^"(.*)"$/, '$1');
        const path = /(?:^|\n)path:\s*(.+)/.exec(s)?.[1]?.replace(/^"(.*)"$/, '$1');
        const target = page || path || s;
        return `<li>${kind ? `<span class="src-kind">${escapeHtml(kind)}</span>` : ''}${escapeHtml(target)}</li>`;
      });
      return `<section class="sources"><div class="sources-label">来源</div><ul>${items.join('')}</ul></section>`;
    }

    function metaBlock(meta) {
      const parts = [];
      if (meta.description) parts.push(`<p class="lede">${escapeHtml(meta.description)}</p>`);
      if (Array.isArray(meta.tags) && meta.tags.length) parts.push(`<div class="chips">${meta.tags.map((t) => `<span class="chip">#${escapeHtml(t)}</span>`).join('')}</div>`);
      const row = [];
      if (meta.type) row.push(`<span class="meta"><span class="meta-k">类型</span>${escapeHtml(meta.type)}</span>`);
      if (meta.status) row.push(`<span class="meta"><span class="meta-k">状态</span>${escapeHtml(meta.status)}</span>`);
      if (meta.updated) row.push(`<span class="meta"><span class="meta-k">更新</span>${escapeHtml(meta.updated)}</span>`);
      if (row.length) parts.push(`<div class="meta-row">${row.join('')}</div>`);
      if (Array.isArray(meta.sources) && meta.sources.length) parts.push(sourceBlock(meta.sources));
      return parts.join('');
    }

    const params = new URLSearchParams(location.search);
    const pagePath = params.get('path') || '';
    const urlTitle = params.get('title') || '';
    const safePath = pagePath.startsWith('wiki/') && !pagePath.includes('..') ? pagePath : null;

    document.querySelector('#crumb').textContent = safePath || '无效的 Wiki 页面路径';

    if (!safePath) {
      document.querySelector('#article').innerHTML = '<div class="error">无效的 Wiki 页面路径。</div>';
    } else {
      fetch(`../../${safePath}`)
        .then((response) => { if (!response.ok) throw new Error(`source ${response.status}`); return response.text(); })
        .then((text) => {
          const { meta, body } = parseFrontmatter(text);
          const title = urlTitle || meta.title || safePath;
          document.title = `${title} · MyWiki`;
          document.querySelector('#title').textContent = title;
          document.querySelector('#article').innerHTML = `<div class="meta-block">${metaBlock(meta)}</div><div class="md">${renderBlocks(body.replace(/\r\n/g, '\n').split('\n'))}</div>`;

          const rawPre = document.querySelector('#raw');
          rawPre.innerHTML = `<pre>${escapeHtml(text)}</pre>`;

          const toggle = document.querySelector('#raw-toggle');
          const reader = document.querySelector('#reader');
          toggle.addEventListener('click', () => {
            const showingRaw = rawPre.hidden === false;
            rawPre.hidden = showingRaw;
            reader.hidden = !showingRaw;
            toggle.textContent = showingRaw ? '查看 Markdown 原文' : '返回阅读视图';
            toggle.setAttribute('aria-pressed', String(!showingRaw));
          });
        })
        .catch((error) => { document.querySelector('#article').innerHTML = `<div class="error">无法加载 Wiki 页面：${escapeHtml(error.message)}</div>`; });
    }
  </script>
</body>
</html>
